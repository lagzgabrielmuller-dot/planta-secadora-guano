name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculos-y-entrega:
    name: Cálculos, datos y archivos de la entrega
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt ruff
      - name: Lint de los programas (errores reales, no estilo)
        run: ruff check fuente simulacion_termica --select E9,F,B --ignore B905
      - name: Pruebas de cálculos, datos y entrega
        run: python -m pytest tests -q

  sitio:
    name: Sitio (portada, visores 3D y simulador)
    # imagen estable: la máquina ya trae las bibliotecas que usa Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # sin --with-deps: no depende de los espejos de apt (el 11/11/2026 no resolvían y el paso quedó colgado);
      # esas dependencias solo agregan fuentes tipográficas que el sitio no usa
      - name: Instalar Playwright y Chromium
        working-directory: tests/e2e
        run: npm install --no-audit --no-fund && npx playwright install chromium
      - name: Probar el sitio servido por HTTP
        run: node tests/e2e/probar_sitio.js
